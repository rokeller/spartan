name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum

      - name: Build spartan
        run: |
          echo 'Building minimal ...'
          go build -tags minimal

          echo 'Building all ...'
          go build

      - name: Test Server
        run: go test ./...

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_tags: ["minimal", "tools"]
        base_image: ["scratch", "distroless"]
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: |
          case "${{ matrix.go_tags }}-${{ matrix.base_image }}" in
            minimal-scratch)
              TAG='latest'
              ;;
            minimal-*)
              TAG='${{ matrix.base_image }}'
              ;;
            *-scratch)
              TAG='${{ matrix.go_tags }}'
              ;;
            *)
              TAG='${{ matrix.go_tags }}-${{ matrix.base_image }}'
              ;;
          esac

          echo "Building image tag '$TAG' ..."
          docker image build \
            --build-arg SPARTAN_TAGS=${{ matrix.go_tags }} \
            -t spartan:$TAG \
            -f Dockerfile.${{ matrix.base_image }} \
            .
