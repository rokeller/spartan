name: Release

on:
  release:
    types:
      - published

env:
  IMAGE_SERVER: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum

      - name: Build spartan
        run: go build

  container-image:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine image tags
        run: |
          bash extract-tags.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_SERVER }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR }}
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR_MINOR }}
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR_MINOR_PATCH }}
