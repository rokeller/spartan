name: Release

on:
  release:
    types:
      - published

env:
  IMAGE_SERVER: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum

      - name: Build spartan
        run: go build

      - name: Test Server
        run: go test ./...

  container-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_tags: ["minimal", "tools"]
        base_image: ["scratch", "distroless"]
    needs: build-test
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine image tags
        run: |
          echo "ref name: $GITHUB_REF_NAME"
          bash extract-tags.sh "$GITHUB_REF_NAME" | tee --append "$GITHUB_ENV"

          echo 'go tags   : ${{ matrix.go_tags }}'
          echo 'base image: ${{ matrix.base_image }}'
          case '${{ matrix.go_tags }}-${{ matrix.base_image }}' in
            minimal-scratch)
              TAG_SUFFIX=''
              DESC_SUFFIX=' (minimal)'
              ;;
            minimal-*)
              TAG_SUFFIX='-${{ matrix.base_image }}'
              DESC_SUFFIX=' (minimal)'
              ;;
            *-scratch)
              TAG_SUFFIX='-${{ matrix.go_tags }}'
              DESC_SUFFIX=' with ${{ matrix.go_tags }}'
              ;;
            *)
              TAG_SUFFIX='-${{ matrix.go_tags }}-${{ matrix.base_image }}'
              DESC_SUFFIX=' with ${{ matrix.go_tags }}'
              ;;
          esac
          echo "TAG_SUFFIX=$TAG_SUFFIX" | tee --append "$GITHUB_ENV"
          echo "DESC_SUFFIX=$DESC_SUFFIX" | tee --append "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_SERVER }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
            SPARTAN_TAGS=${{ matrix.go_tags }}
          context: .
          file: Dockerfile.${{ matrix.base_image }}
          push: true
          tags: |
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR }}${{ env.TAG_SUFFIX }}
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR_MINOR }}${{ env.TAG_SUFFIX }}
            ${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.VER_MAJOR_MINOR_PATCH }}${{ env.TAG_SUFFIX }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=spartan web server${{ env.DESC_SUFFIX }}
